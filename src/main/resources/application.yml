server:
  port: 8082

spring:
  application:
    name: machine-state-service

  datasource:
    url: jdbc:h2:mem:machinedb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: machine-state-service
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  topic-prefix: laundry/cameroon
  qos: 1
  reconnect-interval: 5

machine:
  available-ids:
    - washer_01
    - washer_02
    - washer_03
    - washer_04
    - washer_05
    - washer_06
    - dryer_01
    - dryer_02
    - dryer_03
    - dryer_04
  heartbeat-timeout-seconds: 120
  cycle-check-interval-ms: 60000

payment-service:
  base-url: http://localhost:8081

# ── EQLink Open API v2 integration ───────────────────────────────────────────
# EQLink is a machine CONTROL platform (not a payment system).
# Set enabled: true to activate. When disabled, all commands go through MQTT only.
#
# Auth uses MD5 signature (NOT a Bearer token):
#   sign = MD5(sorted_params + "&secret_key=SECRET_KEY").toUpperCase()
#
# All API calls are POST to: {base-url}/api/open/v2/Device/<endpoint>
eqlink:
  enabled: ${EQLINK_ENABLED:false}
  base-url: ${EQLINK_BASE_URL:https://tokyo.anlun.vip}
  vendor-id: ${EQLINK_VENDOR_ID:}
  app-id: ${EQLINK_APP_ID:}
  secret-key: ${EQLINK_SECRET_KEY:}
  wifi-ssid: ${EQLINK_WIFI_SSID:}
  poll-interval-ms: ${EQLINK_POLL_INTERVAL_MS:30000}
  # Default vend_price per pulse. Override via status check or per-machine config.
  # total_amt = pulse_count × default-vend-price
  default-vend-price: ${EQLINK_DEFAULT_VEND_PRICE:10}
  # Maps internal machine IDs to EQLink devicename (module serial numbers).
  # Configure via EQLINK_DEVICE_* env vars or in ci/dev.yaml.
  device-name-mapping: {}

# ── Security: Auth0 Resource Server ──────────────────────────────────────────
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://dev-iuo6si32jobgnmod.eu.auth0.com/}

auth0:
  audience: ${AUTH0_AUDIENCE:https://smartlaundry.api}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Springdoc / Swagger UI ────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    oauth:
      client-id: ${SWAGGER_CLIENT_ID:}
      client-secret: ${SWAGGER_CLIENT_SECRET:}
  show-actuator: false
