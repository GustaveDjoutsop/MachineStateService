# ─────────────────────────────────────────────────────────────────────────────
# MachineStateService — Dev environment configuration
#
# Load with:
#   java -jar target/machine-state-service-*.jar \
#     --spring.config.additional-location=file:./ci/dev.yaml
# ─────────────────────────────────────────────────────────────────────────────

server:
  port: 8082

spring:
  application:
    name: machine-state-service-dev

  # ── Database: H2 in-memory for dev ──────────────────────────────────────────
  datasource:
    url: jdbc:h2:mem:machinedb_dev;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ── Auth0 Resource Server (dev tenant) ──────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-iuo6si32jobgnmod.eu.auth0.com/

auth0:
  audience: https://smartlaundry.api

# ── Auth0 M2M client (dev) ────────────────────────────────────────────────────
auth0-client:
  id: qrhBuc3lsJfRqsP8xKWAO334DOsseidM
  secret: ${AUTH0_CLIENT_SECRET:5_L-EOe5BBn3g2V9egVHWnKJkabkxtqom4kIqxluEx8J0N6VEbFtG7XPdoCZln7G}
  token-url: https://dev-iuo6si32jobgnmod.eu.auth0.com/oauth/token

# ── EQLink Open API v2 (dev) ─────────────────────────────────────────────────
# EQLink is a machine CONTROL platform. Auth uses MD5 signature (NOT Bearer token).
# Obtain vendor_id, app_id, secret_key from EQLink admin: +86 186 5325 0609 / eqlink.top
#
# Authentication formula:
#   sign = MD5(sorted_params + "&secret_key=SECRET_KEY").toUpperCase()
#
# device-name-mapping: maps your internal machine IDs to EQLink devicename serials.
# Get the actual devicename values by calling get_device_list after setup.
eqlink:
  enabled: ${EQLINK_ENABLED:false}
  base-url: ${EQLINK_BASE_URL:https://tokyo.anlun.vip}
  vendor-id: ${EQLINK_VENDOR_ID:}
  app-id: ${EQLINK_APP_ID:}
  secret-key: ${EQLINK_SECRET_KEY:}
  wifi-ssid: ${EQLINK_WIFI_SSID:EQLink}
  poll-interval-ms: 30000
  default-vend-price: ${EQLINK_DEFAULT_VEND_PRICE:10}
  device-name-mapping:
    washer_01: ${EQLINK_DEVICE_WASHER_01:}
    washer_02: ${EQLINK_DEVICE_WASHER_02:}
    washer_03: ${EQLINK_DEVICE_WASHER_03:}
    washer_04: ${EQLINK_DEVICE_WASHER_04:}
    washer_05: ${EQLINK_DEVICE_WASHER_05:}
    washer_06: ${EQLINK_DEVICE_WASHER_06:}
    dryer_01: ${EQLINK_DEVICE_DRYER_01:}
    dryer_02: ${EQLINK_DEVICE_DRYER_02:}
    dryer_03: ${EQLINK_DEVICE_DRYER_03:}
    dryer_04: ${EQLINK_DEVICE_DRYER_04:}

# ── MQTT: local broker for dev ───────────────────────────────────────────────
mqtt:
  broker-url: tcp://localhost:1883
  client-id: machine-state-service-dev
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  topic-prefix: laundry/cameroon
  qos: 1
  reconnect-interval: 5

# ── Machine seeding ───────────────────────────────────────────────────────────
machine:
  available-ids:
    - washer_01
    - washer_02
    - washer_03
    - washer_04
    - washer_05
    - washer_06
    - dryer_01
    - dryer_02
    - dryer_03
    - dryer_04
  heartbeat-timeout-seconds: 120
  cycle-check-interval-ms: 60000

# ── CORS ─────────────────────────────────────────────────────────────────────
cors:
  allowed-origins: "http://localhost:3000,http://localhost:4200,http://localhost:8080"

# ── Swagger UI ────────────────────────────────────────────────────────────────
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    oauth:
      client-id: qrhBuc3lsJfRqsP8xKWAO334DOsseidM

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.smartlaundromat: DEBUG
    org.springframework.security: DEBUG
    org.eclipse.paho: INFO
